<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Android</title>
  <meta name="description" content="Yeni Form Android uygulamasını Google Play’den indir." />
  <link rel="canonical" href="https://www.yeniform.com/indir" />
  <meta http-equiv="refresh" content="0;url=https://play.google.com/store/apps/details?id=com.yeniform.app" />
  <meta property="og:title" content="Android" />
  <meta property="og:description" content="Yeni Form’u Google Play’den indir." />
  <meta property="og:url" content="https://www.yeniform.com/indir" />
  <meta property="og:image" content="https://www.yeniform.com/og-image.png" />
  <meta name="theme-color" content="#0f161c" />
  <style>
    :root { --text: #1a2332; --muted: #3a4550; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      color: #edf2f6;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #0f161c;
    }
    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    }
    .scene {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 55% at 12% -8%, rgba(45, 143, 196, 0.42), transparent 58%),
        radial-gradient(ellipse 70% 50% at 108% 8%, rgba(68, 150, 100, 0.34), transparent 52%),
        radial-gradient(ellipse 60% 45% at 50% 118%, rgba(212, 168, 83, 0.18), transparent 55%),
        linear-gradient(165deg, #0f161c 0%, #122028 42%, #0f1a16 100%);
    }
    .scene::before {
      content: "";
      position: absolute;
      inset: -20%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 72%);
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.7;
    }
    .orb-a { width: 280px; height: 280px; left: -70px; top: 8%; background: #2d8fc4; }
    .orb-b { width: 240px; height: 240px; right: -60px; top: 18%; background: #357a50; }
    .orb-c { width: 200px; height: 200px; left: 28%; bottom: -40px; background: #c4923a; opacity: 0.35; }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 36px 24px 28px;
      text-align: center;
      border-radius: 32px;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(250, 251, 252, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
    }
    .play-mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(36, 120, 168, 0.18), 0 0 0 1px #e4eaef;
    }
    .play-mark svg { width: 42px; height: 42px; display: block; }
    img.logo { width: 168px; max-width: 72%; height: auto; }
    h1 {
      margin: 16px 0 8px;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      border-radius: 16px;
      padding: 15px 18px;
      font-size: 1.02rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(118deg, #1f6289 0%, #2d8fc4 42%, #449664 100%);
      box-shadow: 0 12px 28px rgba(36, 120, 168, 0.28);
    }
    .btn svg { width: 22px; height: 22px; }
  </style>
  <script>
    (function () {
      var play = 'https://play.google.com/store/apps/details?id=com.yeniform.app'
      var market = 'market://details?id=com.yeniform.app'
      var android = /Android/i.test(navigator.userAgent || '')
      try {
        window.location.replace(android ? market : play)
      } catch (e) {}
      setTimeout(function () { window.location.replace(play) }, 350)
    })()
  </script>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>
  <main class="card">
    <div class="play-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <path fill="#00A0FF" d="M5.8 3.8c-.5.5-.8 1.3-.8 2.2v36c0 .9.3 1.7.8 2.2l.1.1 20.2-20.2v-.2L5.8 3.8z"/>
        <path fill="#00F076" d="M34.7 32.8 25.3 23.4v-.2l9.4-9.4.1.1 5.6 3.2c1.9 1.1 1.9 2.9 0 4L34.7 32.8z"/>
        <path fill="#FFD500" d="M34.8 32.7 25.3 23.2 5.8 42.2c.7.8 1.9.9 3.3.1l25.7-14.6z"/>
        <path fill="#FF3A44" d="M34.8 13.7 9.1 4.1C7.7 3.3 6.5 3.4 5.8 4.2l19.5 19 9.5-9.5z"/>
      </svg>
    </div>
    <img class="logo" src="/brand-logo.png?v=4" alt="Yeni Form" width="168" height="46" />
    <h1>Android</h1>
    <p class="lead">Google Play’e yönlendiriliyorsunuz.</p>
    <a class="btn" id="playBtn" href="https://play.google.com/store/apps/details?id=com.yeniform.app">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#00A0FF" d="M5.8 3.8c-.5.5-.8 1.3-.8 2.2v36c0 .9.3 1.7.8 2.2l.1.1 20.2-20.2v-.2L5.8 3.8z"/>
        <path fill="#00F076" d="M34.7 32.8 25.3 23.4v-.2l9.4-9.4.1.1 5.6 3.2c1.9 1.1 1.9 2.9 0 4L34.7 32.8z"/>
        <path fill="#FFD500" d="M34.8 32.7 25.3 23.2 5.8 42.2c.7.8 1.9.9 3.3.1l25.7-14.6z"/>
        <path fill="#FF3A44" d="M34.8 13.7 9.1 4.1C7.7 3.3 6.5 3.4 5.8 4.2l19.5 19 9.5-9.5z"/>
      </svg>
      Google Play’de indir
    </a>
  </main>
</body>
</html>
