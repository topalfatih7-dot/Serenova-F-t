<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Yeni Form — Doğrulama</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #f3f6f8;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a2332;
    }
    body.embed {
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    body.redirect {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafbfc;
      padding: 24px;
    }
    .box { text-align: center; width: 100%; }
    body.embed h1,
    body.embed p { display: none; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #3a4550; margin: 0 0 16px; line-height: 1.4; }
    #cf-host {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 130px;
      width: 100%;
    }
    .err { color: #c2410c; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bot doğrulaması</h1>
    <p>Girişe devam etmek için doğrulamayı tamamlayın.</p>
    <div id="cf-host"></div>
    <div class="err" id="err" hidden></div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var mode = params.get('mode') || 'redirect';
      var redirect = params.get('redirect') || 'yeniform://turnstile';
      var sitekey = params.get('sitekey') || '0x4AAAAAAD4hSxrtteaRCHNg';
      var err = document.getElementById('err');
      var embed = mode === 'embed' || Boolean(window.ReactNativeWebView);

      document.body.className = embed ? 'embed' : 'redirect';

      function post(type, token) {
        var payload = JSON.stringify({ type: type, token: token || '' });
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(payload);
        }
      }

      function finish(token) {
        if (embed) {
          post('token', token);
          return;
        }
        var sep = redirect.indexOf('?') >= 0 ? '&' : '?';
        location.replace(redirect + sep + 'token=' + encodeURIComponent(token || ''));
      }

      function mount() {
        if (!window.turnstile) return;
        post('ready', '');
        // compact = 150×140 — dar mobil formda normal(300px) clip olup kayboluyordu
        window.turnstile.render('#cf-host', {
          sitekey: sitekey,
          theme: 'light',
          size: embed ? 'compact' : 'normal',
          callback: function (token) { finish(token); },
          'error-callback': function () {
            err.hidden = false;
            err.textContent = 'Doğrulama başarısız. Kutuyu yenileyin.';
            post('error', 'Doğrulama başarısız.');
            post('token', '');
          },
          'expired-callback': function () {
            err.hidden = false;
            err.textContent = 'Süre doldu. Kutuyu yenileyin.';
            post('token', '');
          }
        });
        post('ready', '');
      }

      var t = setInterval(function () {
        if (window.turnstile) { clearInterval(t); mount(); }
      }, 40);
    })();
  </script>
</body>
</html>
