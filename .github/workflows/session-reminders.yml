# Randevu + habit hatırlatmaları — YEDEK tetikleyici.
# Birincil: Supabase pg_cron (her 10 dk) → /api/ai-blog-generate. Bu iş yalnızca
# pg_cron/pg_net kesintisinde devreye giren yedektir; idempotency (waReminders /
# pushLog) çift bildirim atmaz.
# Custom domain zorunlu: *.vercel.app SSO korumalı, cron 401 alır.
#
# Gerekli GitHub Secrets:
#   CRON_SECRET          — Vercel’deki CRON_SECRET ile aynı
#   HEALTH_CHECK_URL     — opsiyonel; varsayılan https://www.yeniform.com

name: Reminders (backup)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run reminder tasks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret eksik"
            exit 1
          fi
          BASE="${HEALTH_CHECK_URL:-https://www.yeniform.com}"
          BASE="${BASE%/}"
          fail=0
          for TASK in session-reminders habit-reminders; do
            URL="${BASE}/api/ai-blog-generate?task=${TASK}"
            echo "GET $URL"
            if curl -fsS -X GET "$URL" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              -o "/tmp/${TASK}.json"; then
              python3 - "$TASK" <<'PY'
import json, sys
task = sys.argv[1]
with open(f"/tmp/{task}.json") as f:
    data = json.load(f)
print(task, json.dumps(data, ensure_ascii=False)[:1000])
if not data.get("ok"):
    sys.exit(2)
PY
            else
              echo "::warning::${TASK} isteği başarısız"
              fail=1
            fi
          done
          exit $fail
