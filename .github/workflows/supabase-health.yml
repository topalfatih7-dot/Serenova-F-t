# Saatlik Supabase sağlık kontrolü → Vercel API → Telegram
# Vercel Hobby yalnızca günlük cron’a izin verdiği için tetikleyici burada.
#
# Gerekli GitHub Secrets:
#   CRON_SECRET          — Vercel’deki CRON_SECRET ile aynı
#   HEALTH_CHECK_URL     — opsiyonel; varsayılan https://www.yeniform.com

name: Supabase health check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run health check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret eksik"
            exit 1
          fi
          BASE="${HEALTH_CHECK_URL:-https://www.yeniform.com}"
          BASE="${BASE%/}"
          URL="${BASE}/api/ai-blog-generate?task=supabase-health"
          echo "GET $URL"
          curl -fsS -X GET "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            -o /tmp/health.json
          python3 - <<'PY'
          import json, sys
          with open("/tmp/health.json") as f:
              data = json.load(f)
          print(json.dumps(data, indent=2, ensure_ascii=False)[:2000])
          if not data.get("ok"):
              sys.exit(1)
          PY
